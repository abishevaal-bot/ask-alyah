name: Build Ask Alyah

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o "alyah_style (3).zip" -d project

      - name: Show project structure
        run: |
          echo "=== PUBSPEC ==="
          find project -maxdepth 4 -type f -name "pubspec.yaml" -print
          echo "=== FOLDERS ==="
          find project -maxdepth 2 -type d -print

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get packages
        working-directory: project
        run: flutter pub get

      - name: Build web
        working-directory: project
        run: flutter build web --base-href "/ask-alyah/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
